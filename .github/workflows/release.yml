name: PlotForge release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag for the draft release
        required: true
      build_run_id:
        description: Previous release run with three successful installer jobs
        required: true

permissions:
  contents: read

concurrency:
  group: plotforge-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'wdk08/PlotForge' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag, source version and signing configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" && test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || {
            echo 'Configure TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.' >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/plot/release-config.mjs
      - run: npm ci
      - run: npm run check

  draft:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: Create the draft for the verified tag
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_TAG" = 'v1.0.0' ]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "PlotForge $RELEASE_TAG" \
              --notes 'First release of PlotForge, the offline visual story planner from Forge Studios.'
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "PlotForge $RELEASE_TAG" --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json databaseId --jq '"id=\(.databaseId)"' >> "$GITHUB_OUTPUT"

  installers:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Each platform contributes to the same latest.json.
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Build and upload signed updater packages and installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          releaseDraft: true
          tagName: ${{ github.ref_name }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
      - name: Verify the updater signatures and their signed version
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify_updater -- src-tauri/tauri.conf.json src-tauri/target/${{ matrix.target }}/release/bundle

  publish:
    needs: [draft, installers]
    if: >-
      ${{ !cancelled() && github.repository == 'wdk08/PlotForge' &&
      ((github.event_name == 'push' && needs.draft.result == 'success' && needs.installers.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.draft.outputs.id }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the previous build and reuse its draft
        if: github.event_name == 'workflow_dispatch'
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"
          workflow_id=$(gh api "repos/$GH_REPO/actions/workflows/release.yml" --jq .id)
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" | jq -e \
            --arg tag "$RELEASE_TAG" --arg sha "$tag_commit" --argjson workflow "$workflow_id" \
            '.event == "push" and .status == "completed" and .workflow_id == $workflow and .head_branch == $tag and .head_sha == $sha'
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" | jq -e '
            ([.jobs[] | select(.name | startswith("installers (")) | select(.conclusion == "success") | .name] | sort) == ([
              "installers (macos-15, aarch64-apple-darwin, app,dmg)",
              "installers (macos-15-intel, x86_64-apple-darwin, app,dmg)",
              "installers (windows-latest, x86_64-pc-windows-msvc, nsis)"
            ] | sort)'
          id=$(gh release view "$RELEASE_TAG" --json databaseId,isDraft --jq 'select(.isDraft) | .databaseId')
          test -n "$id"
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"
      - name: Validate the draft's complete set of installer and updater assets
        run: |
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > release-assets.json
          gh release download "$RELEASE_TAG" --pattern latest.json --pattern '*.sig' --dir release-review
          node scripts/plot/release-config.mjs --assets
          gh release upload "$RELEASE_TAG" release-review/latest.json --clobber
      - name: Publish the verified release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
