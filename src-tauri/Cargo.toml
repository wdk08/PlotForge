[package]
name = "plotforge"
version = "1.2.1"
description = "PlotForge offline visual story planning"
authors = ["wdk08"]
license = "GPL-3.0-only"
edition = "2021"
autoexamples = false
rust-version = "1.90"

[lib]
name = "plotforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true

[[example]]
name = "verify_updater"
path = "examples/verify_updater.rs"
